<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hercy - Sign In</title>
    <link href="assets/css/onboarding.css" rel="stylesheet">
    <link href="assets/icons/favicon.ico" type="image/x-ico" rel="icon">
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body style="height: 100vh">
<div class="container-fluid col-12 h-100" style="height: 100%">
    <div class="row h-100" style="height: 100%">
        <div class="col-lg-4 d-none d-lg-block bg-artwork shadow">
            <div class="brand"></div>
            <p class="text-center col-10 offset-1 brand-tagline">Rediscover the healing power of nature. We are dedicated to providing sustainable, hand-picked herbal blends designed to support your health and happiness every single day.</p>
        </div>
        <div class="col-12 col-lg-8 d-flex" style="height: 100%">
            <div class="col-12 h-100 d-flex justify-content-center align-items-center flex-column">
                    <div class="col-12 col-lg-6">

                    <h1 class="mb-4">Log In</h1>
                    <div class="form-floating mt-3">
                        <input class="form-control" id="email" placeholder="Email" type="text">
                        <label for="email">Email</label>
                    </div>

                    <div class="form-floating position-relative mt-3">
                        <input type="password" id="password" placeholder="confirm_password" class="form-control">
                        <label for="password" class="form-label">password</label>
                        <i class="bi bi-eye-slash password-toggle-icon" onclick="togglePassword('password', this)"></i>
                    </div>

                    <div class="mt-5 d-flex flex-column">
                        <button class="sign-in-button btn"
                                style="background-color: #8bc34a; color: white; font-size: medium"
                                onclick="sign_in()">Sign In
                        </button>
                    </div>
                    <span class="mt-3 d-flex flex-row justify-content-between">
                            <a href="#" style="text-decoration-color:#8bc34a; color: #8bc34a ">Forgot Password ?</a>
                            <a href="sign_up.html" style="text-decoration-color:#8bc34a; color: #8bc34a ">Create Account</a>
                    </span>
                    <div class="mt-4 d-flex align-items-center justify-content-between px-5">
                        <a class="text-decoration-none text-dark me-4" href="#">Privacy Policy</a>
                        <a class="text-decoration-none text-dark me-4" href="#">User Agreement</a>
                        <a class="text-decoration-none text-dark" href="#">Copy writes</a>
                    </div>
                    <div class="mt-2 text-center">
                        <a href="admin_sign_in.html" class="text-decoration-none" style="color: #999; font-size: 0.8rem;">Admin Login</a>
                    </div>

                </div>
            </div>
        </div>
<!--        <div class="col-4 bg-artwork h-100" style="height: 100%"></div>-->
    </div>
</div>

<script src="assets/js/sign_in.js"></script>
<script src="assets/js/notification.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
</body>
</html>
