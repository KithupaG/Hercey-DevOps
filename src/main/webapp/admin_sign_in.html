<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hercey - Admin Login</title>
    <link href="assets/icons/favicon.ico" type="image/x-ico" rel="icon">
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            height: 100vh;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-card {
            background: white;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .admin-card .brand-mark {
            font-size: 2rem;
            font-weight: 600;
            color: #222;
            letter-spacing: 1px;
            margin-bottom: 0;
        }

        .admin-card .brand-sub {
            font-size: 0.85rem;
            font-weight: 300;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .admin-card .form-control {
            border-radius: 0;
            border: 1px solid #ddd;
            font-size: 0.95rem;
        }

        .admin-card .form-control:focus {
            border-color: #666;
            box-shadow: none;
        }

        .admin-card .btn-admin {
            background-color: #444;
            color: white;
            border-radius: 0;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            font-weight: 400;
            border: none;
            transition: background-color 0.2s;
        }

        .admin-card .btn-admin:hover {
            background-color: #222;
            color: white;
        }

        .admin-card .form-floating > label {
            font-weight: 300;
            color: #888;
        }

        .admin-card .password-toggle-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            z-index: 10;
            color: #aaa;
        }

        .admin-card .form-floating input {
            padding-right: 40px;
        }

        .admin-card a {
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .admin-card a:hover {
            color: #222;
            text-decoration: underline;
        }

        .admin-divider {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 1.5rem 0;
        }

        ::selection {
            background-color: rgba(0, 0, 0, 0.15);
            color: #000;
        }
        ::-moz-selection {
            background-color: rgba(0, 0, 0, 0.15);
            color: #000;
        }
    </style>
</head>
<body>

<div class="admin-card">

    <p class="brand-mark text-center">Hercey</p>
    <p class="brand-sub text-center">admin</p>

    <div class="form-floating mt-3">
        <input class="form-control" id="email" placeholder="Email" type="text">
        <label for="email">Email</label>
    </div>

    <div class="form-floating position-relative mt-3">
        <input type="password" id="password" placeholder="password" class="form-control">
        <label for="password" class="form-label">Password</label>
        <i class="bi bi-eye-slash password-toggle-icon" onclick="togglePassword('password', this)"></i>
    </div>

    <div class="mt-4 d-flex flex-column">
        <button class="btn btn-admin w-100" onclick="adminSignIn()">Sign In</button>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <a href="#">Forgot Password ?</a>
        <a href="sign_in.html">User Login</a>
    </div>

    <hr class="admin-divider">

    <div class="d-flex justify-content-center gap-4">
        <a class="text-decoration-none" href="#">Privacy Policy</a>
        <a class="text-decoration-none" href="#">User Agreement</a>
    </div>

</div>

<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        icon.classList.toggle('bi-eye-slash');
        icon.classList.toggle('bi-eye');
    }

    async function adminSignIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
            Notiflix.Notify.failure('Please fill in all fields');
            return;
        }

        Notiflix.Loading.standard('Signing in...');

        try {
            const response = await fetch('api/admin/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (data.status) {
                Notiflix.Loading.remove();
                Notiflix.Notify.success(data.message);

                // Redirect to admin dashboard after 1 second
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);
            } else {
                Notiflix.Loading.remove();
                Notiflix.Notify.failure(data.message || 'Login failed. Please try again.');
            }
        } catch (error) {
            Notiflix.Loading.remove();
            Notiflix.Notify.failure('An error occurred. Please try again.');
            console.error('Error:', error);
        }
    }
</script>

<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
</body>
</html>
