detectors:
  - name: generic-xml-password
    keywords:
      - password
      - pwd
      - secret
    regex:
      value: '(?i)<property\s+name="[^"]*(?:password|pwd|secret)[^"]*">\s*([^<\s]+)\s*</property>'

  - name: generic-properties-password
    keywords:
      - password
      - pwd
      - secret
      - credentials
    regex:
      value: '(?i)(?:password|pwd|secret|credentials)\s*=\s*([^\s#]+)'