apiVersion: apps/v1
kind: Deployment
metadata:
  name: jboss-app
  labels:
    app: jboss-app
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: jboss-app
    template:
      metadata:
        labels:
          app: jboss-app
      spec:
        containers:
        - name: jboss-eap
          image: registry.acess.redhat.com/ubi9/openjdk-17:1.20
          command: ["/opt/jboss-eap/bin/standalone.sh"]
          args: ["-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]
          ports:
          - containerPort: 8080
            name: http
          - containerPort: 9990
            name: management
---
apiVersion: v1
kind: Service
metadata:
  name: jboss-service
spec:
  type: NodePort
  selector:
    app: jboss-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    NodePort: 30080