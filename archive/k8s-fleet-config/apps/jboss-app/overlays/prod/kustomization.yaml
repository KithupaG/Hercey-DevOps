apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: 192.168.56.50/hercey/jboss-app
  newName: 192.168.56.50/hercey/hercey
  newTag: 1.0.22

patches:
- target:
    kind: Service
    name: jboss-app-service
  patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30083
